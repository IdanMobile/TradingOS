    - >-
      The exact vectorbt virtual environment is ignored locally; the complete
      package manifest is tracked and preflight verifies the active environment.
    - >-
      Five-minute OHLCV has no historical bid/ask book, queue, latency, or impact
      evidence. S1-S3 are declared adverse-price stresses, not empirical S4.
    - Historical upstream family admission and earlier informal research remain unavailable.

