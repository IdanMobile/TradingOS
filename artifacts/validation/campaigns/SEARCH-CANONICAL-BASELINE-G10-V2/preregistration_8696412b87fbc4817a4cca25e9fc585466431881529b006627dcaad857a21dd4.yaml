  cause: >-
    A code-acceptance performance smoke ran the complete extractor before this
    contract reached an immutable Git commit.
  information_observed:
    - B2 coarse numeric verdict was FAIL.
    - B3 coarse numeric verdict was METHOD_BLOCKED.
    - B4 coarse numeric verdict was FAIL.
    - Campaign-wide coarse numeric verdict was METHOD_BLOCKED.
  retained_campaign_evidence: NONE
  effect: >-
    The formal V2 run remains useful for immutable reproduction, canonical-rule
    conformance, cost sensitivity, and method auditing, but it is not an unseen
    or confirmatory statistical test. No V2 historical result may be described
    as prospective evidence.
  remedy: >-
    Freeze this exposure, method, code, and scope before the formal run; make no
    result-driven changes; rely only on the post-freeze future holdout for
    genuinely prospective evidence.

