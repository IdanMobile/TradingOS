stop_rules:
  - Abort before execution on any code, data, source-manifest, spec, or environment pin mismatch.
  - Abort before execution unless Git is clean and the campaign is PREREGISTERED_NOT_RUN.
  - Abort on a missing trial, scenario, fold, undefined required input, or independent-method disagreement.
  - Retain structural zero-trade trials and undefined correlations; never silently drop or impute them.
  - Do not add candidates, parameters, data, scenarios, engines, folds, or transformations after start; create V3.
  - A numeric PASS remains non-promotional while upstream search, S4 execution evidence, and prospective evidence are incomplete.
  - The campaign must never access a venue, credential, order route, or network.

