  Recompute the frozen B2/B3/B4 baseline families with their declared causal
  rules, next-adjacent-bar-open execution, a six-cell cost surface, chronological
  historical pseudo-out-of-sample diagnostics, and family plus campaign-wide
  PBO/DSR. This is a bounded offline canonical-rule campaign, not promotion or
  live-fill evidence.
