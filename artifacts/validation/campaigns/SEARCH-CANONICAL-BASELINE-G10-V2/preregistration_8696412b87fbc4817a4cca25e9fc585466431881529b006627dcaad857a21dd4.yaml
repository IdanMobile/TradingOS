    buy_price: open * (1 + slippage_rate)
    sell_price: open * (1 - slippage_rate)
    funding: NOT_APPLICABLE_SPOT
    spread: NOT_SEPARATELY_OBSERVED
    market_impact: NOT_OBSERVED
