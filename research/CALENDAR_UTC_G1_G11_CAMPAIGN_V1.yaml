    effective_trials: APPENDIX_3_AVERAGE_CORRELATION_CLIPPED_AT_ZERO
    threshold_minimum: 0.95
  robustness:
    clock_offsets_hours: [-1, 1]
    role: POST_SELECTION_DIAGNOSTICS_NOT_SELECTION_TRIALS
    pass_rule: BOTH_FULL_HISTORY_F1_S1_TOTAL_RETURNS_POSITIVE
  benchmarks: [CASH, BTCUSDT_BUY_AND_HOLD_F1_S1]

hard_gates:
  G1_DATA_PROVENANCE: exact offline package verification
  G2_CANONICAL_IDENTITY: valid spec and seven immutable StrategyVersion identities
  G3_CAUSAL_GOLDENS: hand-derived timing, cost, gap, and price-invariance tests
  G4_INDEPENDENT_REPRODUCTION: Decimal reference and vectorbt metrics agree within 1e-10
  G5_AFTER_COST_ECONOMICS: selected full-history return positive at F1/S1 and F2/S3
  G6_CHRONOLOGICAL_OOS: selected 2024 and reserved 2025-2026H1 returns both positive at F1/S1
  G7_SAMPLE_AND_CLOCK_ROBUSTNESS: >-
    development completed trades >=140, 2024 >=45, reserve >=70, and both
    preregistered clock-offset diagnostics positive at F1/S1
  G8_REGIME_AND_TAIL: at least four of six year/H1 returns positive and max drawdown no worse than -25 percent
  G9_BENCHMARK_AND_OPPORTUNITY: selected Sharpe exceeds buy-and-hold and selected max drawdown is smaller
  G10_MULTIPLE_TESTING: PBO <=0.5 and corrected DSR >=0.95
  G11_INDEPENDENT_RISK_SUPERVISOR: NOT_RUN_UNTIL_NUMERIC_PACKAGE_EXISTS

stop_rules:
  - Abort before scoring on dirty Git or any pin, roster, data, spec, environment, cost, split, or safety mismatch.
  - Abort on any missing weekday, cost cell, segment, metric, reference result, or vectorbt result.
  - Retain every weekday even if it has zero trades or undefined economics.
  - Do not inspect the reserved result before development selection.
  - No threshold, roster, cost, split, benchmark, or gap-rule change after results.
  - Any hard FAIL rejects this exact context; no rescue, combination, or alternate selector is allowed.
  - G11 remains NOT_RUN until the immutable numeric package exists and can independently reject it.
  - Numeric PASS never grants promotion, paper, demo, live, credential, venue, or order authority.

