purpose:
  association_question: >-
    After the frozen warm-up, are prospective six-hour BTC Spot returns materially lower after
    independent LONG_LIQUIDATION_STRESS episode onsets than after deterministic time-matched
    NORMAL controls?
  overlay_question: >-
    For a separately validated exact alpha StrategyVersion, does suppressing new long entries
    during the frozen six-hour risk window improve its after-cost out-of-sample risk/economic
    profile relative to the identical unfiltered strategy?
  non_claims:
    - Predictive association is not proof that forced orders caused the later Spot return.
    - The publication stream is a throttled snapshot, not a complete liquidation tape.
    - Association support is not alpha, StrategyVersion validation, or overlay validation.
    - This parent campaign cannot create an order or authorize paper, demo, testnet, or live use.

