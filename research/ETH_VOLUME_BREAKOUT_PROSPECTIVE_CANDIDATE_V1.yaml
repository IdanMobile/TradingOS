  parameter_changes: PROHIBITED
  instrument_or_timeframe_changes: PROHIBITED
  data: public closed ETHUSDT Spot 1h klines strictly at or after prospective_boundary_utc
  first_review_minimum:
    elapsed_days: 365
    completed_round_trips: 80
  primary_cost_model:
    fee_bps_per_executed_side: 10
    slippage_bps_per_executed_side: 5
  stress_cost_model:
    fee_bps_per_executed_side: 15
    slippage_bps_per_executed_side: 10
  benchmarks: [CASH, ETHUSDT_BUY_AND_HOLD, UNFILTERED_DONCHIAN_40]
  minimum_numeric_conditions:
    - positive after-cost total return under the primary and stress cost models
    - positive expectancy per completed round trip under the primary cost model
    - primary Sharpe above buy-and-hold Sharpe
    - primary maximum drawdown less severe than buy-and-hold maximum drawdown
    - at least 3 of 4 chronological quarters have non-negative return
  stop_rules:
    - No early performance read, parameter rescue, alternate asset, or alternate timeframe.
    - Any semantic, data-lineage, timing, or authority mismatch fails closed.
    - A failed review rejects this exact candidate and requires a new identity.
    - Passing numeric conditions still requires independent risk review and a human HG-3 decision.

