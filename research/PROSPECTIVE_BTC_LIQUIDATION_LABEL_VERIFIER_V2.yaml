acceptance:
  - Every snapshot reconstructs using the source history causally present at its evaluated_at.
  - Adding a later complete window cannot invalidate an older content-addressed snapshot.
  - An older snapshot cannot include a window that had not closed by evaluated_at.
  - Early-label, raw-byte, timing, price, return, eligibility, and authority drift still fail.
  - No failed refresh artifact exists and the next evaluation begins only after this freeze commit.
