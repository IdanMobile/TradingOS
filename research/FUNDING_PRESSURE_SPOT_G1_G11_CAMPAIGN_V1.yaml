  selection_metric: nonannualized_per_1h_bar_sharpe_F1_S1_zero_cash_returns_included
  selection_tie_break: lexical_polarity_lookback_threshold
  chronology:
    development: ["2021-01-01", "2023-12-31 23:00:00+00:00"]
    validation_2024: ["2024-01-01", "2024-12-31 23:00:00+00:00"]
    reserve_2025_2026h1: ["2025-01-01", "2026-06-30 23:00:00+00:00"]
  selection_barrier:
    phase_1: evaluate all 12 trials on development only
    artifact: content-addressed selected StrategyVersion plus development metric and G10
    phase_2: evaluate validation/reserve/full/periods for selected StrategyVersion only
    fail_closed_test: phase_2 call without verified selection artifact must raise
  cost_scenarios:
    - {name: F0/S0, fee_rate_per_side: 0.0, slippage_bps_per_side: 0.0}
    - {name: F1/S1, fee_rate_per_side: 0.001, slippage_bps_per_side: 1.0}
    - {name: F1/S2, fee_rate_per_side: 0.001, slippage_bps_per_side: 5.0}
    - {name: F1/S3, fee_rate_per_side: 0.001, slippage_bps_per_side: 10.0}
    - {name: F2/S2, fee_rate_per_side: 0.0015, slippage_bps_per_side: 5.0}
    - {name: F2/S3, fee_rate_per_side: 0.0015, slippage_bps_per_side: 10.0}
  independent_roles:
    decimal_reference: exact rates/prices/cost ledger
    vectorbt: float64 portfolio acceleration and metric parity
    freqtrade: installed-environment dataframe Spot signal parity
    nautilus: installed-environment exact-event-order and gap parity
  multiple_testing:
    pbo: 16-slice CSCV across all 12 development trials; pass <= 0.5
    dsr: complete trial-return correlation and moment evidence; pass >= 0.95
  final_mark: final Spot close; ending held state reported; no invented liquidation

hard_gates:
  G1_DATA_PROVENANCE: exact package and offline verifier PASS
  G2_CANONICAL_IDENTITY: spec hash and all 12 StrategyVersion identities PASS
  G3_CAUSAL_GOLDENS: exact-millisecond next-open, equality, warmup, gap and cost tests PASS
  G4_INDEPENDENT_REPRODUCTION: all four roles event/count parity and reference/vectorbt metric tolerance <= 1e-10
  G5_AFTER_COST_ECONOMICS: selected full/validation/reserve F1/S1 and full F2/S3 returns all > 0
  G6_CHRONOLOGICAL_OOS: validation and reserve F1/S1 returns both > 0
  G7_SAMPLE_AND_CLOCK_ROBUSTNESS: completed trades development >= 30, validation >= 8, reserve >= 12, one-bar-late full F1/S1 > 0
  G8_REGIME_AND_TAIL: at least 4 of 6 year/H1 segments positive and full F1/S1 max drawdown >= -0.25
  G9_BENCHMARK_AND_OPPORTUNITY: F1/S1 Sharpe above costed buy-and-hold and drawdown smaller
  G10_MULTIPLE_TESTING: PBO <= 0.5 and DSR >= 0.95; undefined inputs fail closed
  G11_INDEPENDENT_RISK_SUPERVISOR: required after numeric run; cannot be self-promoted

stop_and_no_rescue:
  - any source, hash, schema, timestamp, ordering, spec, roster, cost, split, engine, barrier, or threshold mismatch aborts
  - reserve signal, return, or metric computation before the hashed selection artifact rejects the campaign
  - retain every development trial including zero-trade and undefined-statistic trials
  - do not reinterpret funding sign or add thresholds, filters, exits, instruments, sizing, leverage, shorts, or derivatives after results
  - any hard FAIL, method block, or conformance residual rejects this exact context
  - no numeric PASS can activate paper, demo, live, a bot, HG-3, a venue, credentials, or orders

