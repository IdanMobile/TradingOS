method:
  governed_selection_metric: non_annualized_per_bar_sharpe
  metric_applies_to: [candidate_selection, PBO_IS, PBO_OOS, DSR]
  selection_scope: WITHIN_EACH_FAMILY_NO_GLOBAL_66_TRIAL_WINNER
  cscv_contiguous_slice_count: 16
  raw_trial_count: 66
  cost_model:
    scenario: F1/S0
    fee_rate_per_side: 0.001
    slippage_bps_per_side: 0
    slippage_model: NOT_MODELLED
    spread_market_impact_latency: NOT_MODELLED
    initial_cash: 1000.0
    economic_evidence: false
  split:
    method: CSCV_16_CONTIGUOUS_EQUAL_SLICES_PER_FAMILY
    cscv_contiguous_slice_count: 16
    in_sample_slices_per_split: 8
    out_of_sample_slices_per_split: 8
    tail_policy: EXCLUDE_FINAL_11_BARS_FROM_CSCV_ONLY
    full_sample_policy: USE_ALL_577803_BARS_FOR_SELECTION_AND_DSR
    external_holdout: NOT_CONSUMED
  effective_trial_policy: >-
    Retain full bar-return correlations; compute family-scope Appendix-3 implied trials only
    where correlations are defined. This campaign cannot estimate omitted upstream trials.
  holdout_policy: >-
    CSCV uses complementary in/out halves inside the declared dataset. No external holdout is
    consumed, and no result is promotion evidence.
  thresholds:
    pbo_maximum: 0.5
    dsr_minimum: 0.95

