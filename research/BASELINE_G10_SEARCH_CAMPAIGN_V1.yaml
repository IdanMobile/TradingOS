stop_rules:
  - Abort on any missing/non-completed trial, parity mismatch, undefined required input, or independent-recomputation disagreement.
  - Do not add candidates, parameters, datasets, engines, scenarios, or transformations after the campaign starts; create a new campaign version instead.
  - Retain every trial and correlation input even when the result is negative or method-blocked.
  - Never convert a numeric PASS into promotion eligibility; the normal validation and human gates remain separate.

required_output_contract:
  metadata_validator: tios.evidence.validate_substantive_research_metadata
  all_trials_population_required: true
  immutable_output_hash_required: true
  one_validated_metadata_sidecar_per_family: true
  search_lineage_complete_within_declared_scope: true
  upstream_family_admission_complete: false
